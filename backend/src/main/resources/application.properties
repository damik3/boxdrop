spring.application.name=dropbox-clone-backend
server.port=8080

spring.mongodb.uri=mongodb://localhost:27017/dropbox_clone

app.storage.endpoint=${APP_STORAGE_ENDPOINT:http://localhost:9000}
app.storage.public-endpoint=${APP_STORAGE_PUBLIC_ENDPOINT:http://localhost:9000}
app.storage.access-key=${APP_STORAGE_ACCESS_KEY:minioadmin}
app.storage.secret-key=${APP_STORAGE_SECRET_KEY:minioadmin}
app.storage.bucket=${APP_STORAGE_BUCKET:dropbox-clone}
app.storage.region=${APP_STORAGE_REGION:us-east-1}

