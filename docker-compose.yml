services:
  mongodb:
    image: mongo:7.0
    container_name: dropbox-clone-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  elasticmq:
    image: softwaremill/elasticmq-native:latest
    container_name: dropbox-clone-elasticmq
    ports:
      - "9324:9324"
    volumes:
      - ./infra/elasticmq.conf:/opt/elasticmq.conf:ro

  # MinIO has no native SQS target; this forwards webhook events onto ElasticMQ.
  sqs-bridge:
    image: python:3.12-alpine
    container_name: dropbox-clone-sqs-bridge
    command: ["python", "/app/sqs-bridge.py"]
    environment:
      SQS_ENDPOINT: http://elasticmq:9324
      QUEUE_URL: http://elasticmq:9324/000000000000/s3-object-created
    volumes:
      - ./infra/sqs-bridge.py:/app/sqs-bridge.py:ro
    depends_on:
      - elasticmq

  minio:
    image: minio/minio:latest
    container_name: dropbox-clone-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_NOTIFY_WEBHOOK_ENABLE_1: "on"
      MINIO_NOTIFY_WEBHOOK_ENDPOINT_1: http://sqs-bridge:8080/
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    depends_on:
      - sqs-bridge

  minio-init:
    image: minio/mc:latest
    container_name: dropbox-clone-minio-init
    entrypoint: ["/bin/sh", "/init.sh"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_BUCKET: ${APP_STORAGE_BUCKET:-dropbox-clone}
    volumes:
      - ./infra/minio-init.sh:/init.sh:ro
    depends_on:
      - minio
    restart: "no"

  backend:
    build:
      context: ./backend
    container_name: dropbox-clone-backend
    depends_on:
      - mongodb
      - minio
      - elasticmq
      - sqs-bridge
    environment:
      SPRING_MONGODB_URI: ${SPRING_MONGODB_URI}
      APP_STORAGE_ENDPOINT: ${APP_STORAGE_ENDPOINT}
      APP_STORAGE_PUBLIC_ENDPOINT: ${APP_STORAGE_PUBLIC_ENDPOINT}
      APP_STORAGE_ACCESS_KEY: ${APP_STORAGE_ACCESS_KEY}
      APP_STORAGE_SECRET_KEY: ${APP_STORAGE_SECRET_KEY}
      APP_STORAGE_BUCKET: ${APP_STORAGE_BUCKET}
      APP_STORAGE_REGION: ${APP_STORAGE_REGION}
      APP_AUTH_JWT_SECRET: ${APP_AUTH_JWT_SECRET}
      APP_AUTH_JWT_TTL: ${APP_AUTH_JWT_TTL}
      APP_AUTH_REFRESH_TTL_DAYS: ${APP_AUTH_REFRESH_TTL_DAYS}
      APP_FRONTEND_ORIGIN: ${APP_FRONTEND_ORIGIN}
      APP_SQS_ENDPOINT: ${APP_SQS_ENDPOINT}
      APP_SQS_QUEUE_URL: ${APP_SQS_QUEUE_URL}
      APP_SQS_ACCESS_KEY: ${APP_SQS_ACCESS_KEY}
      APP_SQS_SECRET_KEY: ${APP_SQS_SECRET_KEY}
    ports:
      - "8080:8080"

