services:
  mongodb:
    image: mongo:7.0
    container_name: dropbox-clone-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  minio:
    image: minio/minio:latest
    container_name: dropbox-clone-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  backend:
    build:
      context: ./backend
    container_name: dropbox-clone-backend
    depends_on:
      - mongodb
      - minio
    environment:
      SPRING_MONGODB_URI: mongodb://mongodb:27017/dropbox_clone
      APP_STORAGE_ENDPOINT: http://minio:9000
      APP_STORAGE_PUBLIC_ENDPOINT: http://localhost:9000
      APP_STORAGE_ACCESS_KEY: minioadmin
      APP_STORAGE_SECRET_KEY: minioadmin
      APP_STORAGE_BUCKET: dropbox-clone
      APP_STORAGE_REGION: us-east-1
    ports:
      - "8080:8080"

