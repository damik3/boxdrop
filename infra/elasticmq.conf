include classpath("application.conf")

node-address {
  protocol = http
  host = elasticmq
  port = 9324
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = relaxed
}

aws {
  region = us-east-1
  accountId = "000000000000"
}

queues {
  "s3-object-created" {
    defaultVisibilityTimeout = 30 seconds
    delay = 0 seconds
    receiveMessageWait = 20 seconds
    deadLettersQueue {
      name = "s3-object-created-dlq"
      maxReceiveCount = 5
    }
  }
  "s3-object-created-dlq" {}
}
